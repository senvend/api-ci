# Publishes the senvend_api crates to crates.io via trusted publishing.
#
# crates.io does not trust our self-managed GitLab as an OIDC issuer, so the
# upload runs here. Unlike NuGet and PyPI, cargo publishes from source rather
# than from a prebuilt artifact, so release-public.py attaches the workspace
# as a tarball and this workflow packages it.
#
# The trusted publisher is registered per crate on crates.io, all three
# pointing at this workflow file - renaming it breaks all three policies.
#
# A release tagged verify-* (release-public.py check) only exchanges the token,
# proving crates.io still trusts this workflow before a real release starts.
name: publish-crates

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # the only reason this repo exists

jobs:
  verify:
    if: startsWith(github.event.release.tag_name, 'verify-')
    runs-on: ubuntu-latest
    steps:
      # the action revokes the token again when the job ends
      - name: Exchange the OIDC token for a short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

  push:
    if: ${{ !startsWith(github.event.release.tag_name, 'verify-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the workspace from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'senvend-api-rust-src.tar.gz'
          tar xzf senvend-api-rust-src.tar.gz
          ls -l rust

      - name: Exchange the OIDC token for a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # --no-verify: the release job already ran `cargo publish --dry-run`
      # against this exact source during bump. A re-run excludes the crates an
      # earlier attempt published, which cargo would refuse.
      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          exclude=()
          remaining=0
          while read -r name version; do
            if curl -fsS -o /dev/null -A "senvend-api-ci (https://github.com/senvend/api-ci)" \
              "https://crates.io/api/v1/crates/$name/$version"; then
              echo "$name $version is on crates.io already"
              exclude+=(--exclude "$name")
            else
              remaining=$((remaining + 1))
            fi
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          if [ "$remaining" -eq 0 ]; then
            echo "every crate is on crates.io already"
            exit 0
          fi
          cargo publish --workspace --no-verify "${exclude[@]}"
